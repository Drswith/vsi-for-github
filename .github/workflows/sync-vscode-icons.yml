name: Sync vscode-icons

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-vscode-icons
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set initial Git branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: ./.github/actions/setup
      - name: Sync latest upstream release
        id: sync
        run: mise exec -- pnpm sync:upstream
      - run: mise exec -- pnpm check
      - name: Open upstream update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/sync-vscode-icons
          base: main
          delete-branch: true
          commit-message: "chore: sync vscode-icons v${{ steps.sync.outputs.version }}"
          title: "chore: sync vscode-icons v${{ steps.sync.outputs.version }}"
          body: |
            Synchronize the icon mappings and referenced SVG assets from [vscode-icons v${{ steps.sync.outputs.version }}](${{ steps.sync.outputs.release_url }}).

            The generated asset inventory includes the VSIX SHA-256 and a SHA-256 for every bundled SVG. Review `THIRD_PARTY_NOTICES.md` and the upstream license statement with the generated diff.

            This pull request was created automatically and passed the local validation pipeline.
            Select **Approve workflows to run** on this PR to start GitHub's merge-result CI.
            Merge only after the required `build` check succeeds.
