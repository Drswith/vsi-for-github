name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Optional branch or commit to build
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.checkout_ref || github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      - uses: jdx/mise-action@v4
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(mise exec -- pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('mise.toml', 'pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm typecheck
      - run: mise exec -- pnpm build
      - run: mise exec -- pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: vsi-for-github-extension
          path: artifacts/*.zip
          if-no-files-found: error
