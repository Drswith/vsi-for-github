name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Optional branch or commit to build
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.checkout_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ github.event_name == 'workflow_dispatch' && 'manual-build' || 'build' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set initial Git branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v5
        with:
          # pull_request uses GitHub's merge commit in the base repository.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.checkout_ref || github.sha }}
      - uses: ./.github/actions/setup
      - run: mise exec -- pnpm check
      - uses: actions/upload-artifact@v6
        with:
          name: vsi-for-github-extension
          path: artifacts/*.zip
          if-no-files-found: error
