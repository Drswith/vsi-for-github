name: Set up project
description: Install the mise toolchain and frozen pnpm dependencies with a shared cache.
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v4
    - name: Resolve pnpm store path
      id: pnpm-store
      shell: bash
      run: echo "path=$(mise exec -- pnpm store path)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v5
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('mise.toml', 'pnpm-lock.yaml') }}
        restore-keys: ${{ runner.os }}-pnpm-
    - name: Install dependencies
      shell: bash
      run: mise exec -- pnpm install --frozen-lockfile
